<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>생물지도 관리자</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🌱 생물지도 관리자</h1>
    <a href="index.html" class="admin-link">지도로 돌아가기</a>
  </header>

  <section id="loginSection" class="login-section">
    <form id="loginForm" class="login-form">
      <h2>교사 로그인</h2>
      <label>이메일
        <input type="email" id="email" required autocomplete="username" />
      </label>
      <label>비밀번호
        <input type="password" id="password" required autocomplete="current-password" />
      </label>
      <p id="loginError" class="form-status error"></p>
      <button type="submit" class="btn btn-primary">로그인</button>
    </form>
  </section>

  <section id="adminSection" hidden>
    <p id="myGradeInfo" class="my-grade-info"></p>
    <div class="admin-toolbar">
      <div class="toolbar-left">
        <select id="statusFilter">
          <option value="all">전체 상태</option>
          <option value="pending">승인 대기중</option>
          <option value="approved">승인됨</option>
        </select>
        <select id="gradeFilter">
          <option value="all">전체 학년</option>
        </select>
        <select id="classFilter">
          <option value="all">전체 반</option>
        </select>
        <span id="countInfo"></span>
      </div>
      <div class="toolbar-right">
        <button id="backupBtn" class="btn btn-primary">📦 전체 백업 (CSV+사진)</button>
        <button id="changePwBtn" class="btn btn-secondary">🔑 비밀번호 변경</button>
        <button id="logoutBtn" class="btn btn-secondary">로그아웃</button>
      </div>
    </div>
    <p id="backupStatus" class="form-status"></p>

    <div id="changePwSection" class="change-pw-box" hidden>
      <form id="changePwForm">
        <label>새 비밀번호
          <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" />
        </label>
        <label>새 비밀번호 확인
          <input type="password" id="newPasswordConfirm" required minlength="6" autocomplete="new-password" />
        </label>
        <div class="change-pw-actions">
          <button type="button" id="cancelChangePwBtn" class="btn btn-secondary">취소</button>
          <button type="submit" class="btn btn-primary">변경하기</button>
        </div>
        <p id="changePwStatus" class="form-status"></p>
      </form>
    </div>

    <div id="list" class="card-list"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
